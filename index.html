<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a14">
<title>Mi Robo Shelf</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0c0a14; --bg2:#14111f; --card:#1b1729; --card2:#252036; --line:#2f2944;
  --text:#f3f0ff; --muted:#9c94b8; --pink:#ff4f8b; --cyan:#3ee6ff; --gold:#ffc83d; --green:#4be3a0; --red:#ff6b7a;
  --grad:linear-gradient(90deg,var(--pink),var(--cyan));
  --head:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f2fb; --bg2:#ebe7f7; --card:#ffffff; --card2:#efecf8; --line:#ddd7ee;
  --text:#191428; --muted:#6a6385; --pink:#e3266c; --cyan:#0a9fc0; --gold:#c48a00; --green:#139463; --red:#d33a4b;
  color-scheme:light;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 120px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.top{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:3px 13px 3px 3px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13.5px;max-width:100%}
.who span{color:var(--muted);font-weight:600}
.av,.hav{border-radius:50%;background:var(--grad);color:#120c1c;display:grid;place-items:center;font-family:var(--head);font-weight:800;flex:none}
.av{width:24px;height:24px;font-size:12px}
.hero{display:flex;gap:14px;align-items:center;margin-top:14px;padding:16px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 22%,var(--card)),color-mix(in srgb,var(--cyan) 18%,var(--card)));border:1px solid var(--line)}
.hav{width:56px;height:56px;font-size:24px}
.hero h2{font-family:var(--head);font-weight:800;font-size:20px;margin:0;line-height:1.15;word-break:break-word}
.hstats{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-weight:700;font-size:13px}
.hstats b{color:var(--text)}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;position:relative}
.icon-btn .d{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.icon-btn .d.ok{background:var(--green)} .icon-btn .d.err{background:var(--red)} .icon-btn .d.busy{background:var(--gold)}
.tabs{display:flex;gap:6px;margin-top:12px}
.tabs button{padding:8px 14px;border-radius:999px;font-weight:800;color:var(--muted);font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--text);color:var(--bg)}

/* continue rail */
.sec-title{font-family:var(--head);font-weight:500;font-size:15px;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px}
.sec-title small{font-family:var(--body);color:var(--muted);font-size:13px;font-weight:600}
.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.cont{flex:none;width:280px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;gap:12px;padding:10px;align-items:stretch}
.cont .cv{width:72px;flex:none;aspect-ratio:2/3;border-radius:10px}
.cont .info{flex:1;min-width:0;display:flex;flex-direction:column}
.cont .t{font-weight:800;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cont .w{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont .where-now{font-family:var(--head);font-size:20px;font-weight:800;margin-top:auto}
.cont .where-now small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:600}
.cont .ctl{display:flex;gap:6px;margin-top:6px}
.pbar{height:5px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.mini{height:34px;min-width:34px;border-radius:10px;background:var(--card2);font-weight:800}
.plus{height:34px;padding:0 14px;border-radius:10px;background:var(--grad);color:#120c1c;font-weight:800;flex:1}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--text)}
.chip b{font-weight:800;color:var(--text)}
.bar2{display:flex;gap:8px;margin-top:10px}
.bar2 input,.bar2 select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.bar2 input{flex:1}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px}
.cv{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--card2);display:block;width:100%}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;background:linear-gradient(160deg,var(--c) 0%,color-mix(in srgb,var(--c) 30%,var(--bg)) 100%)}
.cv .ph b{font-family:var(--head);font-weight:800;font-size:15px;line-height:1.15;color:#fff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.cont .cv .ph b{font-size:10px}
.badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:800;background:rgba(12,10,20,.72);color:#fff;backdrop-filter:blur(6px)}
.fav{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(12,10,20,.6);color:#fff;font-size:16px;display:grid;place-items:center}
.fav.on{color:var(--pink)}
.rt{position:absolute;bottom:8px;right:8px;padding:3px 8px;border-radius:8px;background:var(--gold);color:#1a1200;font-weight:800;font-size:12.5px}
.cv .pb{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.45)}
.cv .pb i{display:block;height:100%;background:var(--grad)}
.tile .tt{font-weight:800;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .mm{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.st{font-weight:800}
.st.want{color:var(--muted)} .st.progress{color:var(--cyan)} .st.completed{color:var(--green)} .st.reviewed{color:var(--gold)} .st.dropped{color:var(--red)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px}
.empty b{display:block;font-family:var(--head);color:var(--text);font-size:17px;margin-bottom:6px}

.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px;border-radius:18px;background:var(--grad);color:#120c1c;font-weight:800;font-size:16px;box-shadow:0 10px 30px rgba(255,79,139,.35);z-index:9}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,3,10,.6);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;max-height:92%;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--head);font-weight:800;font-size:20px;margin:0 0 14px}
.f{display:grid;gap:6px;margin-bottom:14px}
.f>label,.lbl{font-size:12.5px;color:var(--muted);font-weight:800;letter-spacing:.02em}
.f input,.f select,.f textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.f textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:800}
.finder{display:flex;gap:8px}
.finder input{flex:1}
.go{padding:0 16px;border-radius:12px;background:var(--card2);font-weight:800;border:1px solid var(--line)}
.results{display:flex;gap:10px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.results:empty{display:none}
.res{flex:none;width:96px;text-align:left;font-size:12px;font-weight:600}
.res img,.res .noimg{width:96px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:var(--card2);display:block;margin-bottom:4px}
.res span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.rates{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rates button{padding:9px 0;border-radius:9px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px}
.rates button[aria-pressed="true"]{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper input{text-align:center}
.stepper button{width:44px;height:44px;flex:none;border-radius:12px;background:var(--card2);font-weight:800;font-size:18px}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{height:48px;padding:0 18px;border-radius:14px;font-weight:800;background:var(--card2)}
.btn.main{flex:1;background:var(--grad);color:#120c1c}
.btn.danger{color:var(--red)}
.btn.link{display:inline-flex;align-items:center;text-decoration:none}

/* stats */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:16px}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.sbox b{display:block;font-family:var(--head);font-weight:800;font-size:28px}
.sbox span{color:var(--muted);font-size:13px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.panel h3{font-family:var(--head);font-weight:500;font-size:15px;margin:0 0 12px}
.hb{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;margin-bottom:9px;font-size:13.5px;font-weight:600}
.hb .pbar{margin:0;height:8px}
.rowl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-weight:600}
.rowl:first-of-type{border-top:0}
.panel textarea{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:800;z-index:40;display:none;max-width:90vw;text-align:center}
.by{font-size:12.5px;color:var(--muted);font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.imgrow{display:flex;gap:12px;align-items:center}
.thumb{display:block;width:64px;aspect-ratio:2/3;border-radius:10px;object-fit:cover;background:var(--card2);flex:none}
.credit{text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;padding:36px 0 0;opacity:.8}
.banner{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner a{font-weight:800;color:var(--cyan)}
.ro .ctl,.ro .pbar+.ctl{display:none}
.ro .fav{pointer-events:none}
.ro #stats .panel:last-child{display:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div style="flex:1;min-width:0"><div class="logo" id="logo">Mi Robo <span>Shelf</span></div><div class="who" id="who" hidden><i class="av" id="av" style="font-style:normal"></i><b id="whoName"></b><span>collection</span></div></div>
      <button class="icon-btn" id="themeBtn" aria-label="Switch theme">◐</button>
      <button class="icon-btn" id="syncBtn" aria-label="Sync settings">☁<span class="d" id="syncDot"></span></button>
    </div>
    <div class="tabs" role="group" aria-label="View">
      <button id="tLib" aria-pressed="true">Library</button>
      <button id="tStats" aria-pressed="false">Stats</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden><span id="bannerTxt">Viewing a shared shelf (read only)</span><a href="./">Start my own shelf</a></div>

  <main id="lib">
    <section class="hero" id="hero" hidden>
      <div class="hav" id="hAv"></div>
      <div style="min-width:0"><h2 id="hName"></h2><div class="hstats" id="hStats"></div></div>
    </section>
    <section id="contSec">
      <h2 class="sec-title">Continue <small id="contCount"></small></h2>
      <div class="rail" id="rail"></div>
    </section>
    <h2 class="sec-title">Everything</h2>
    <div class="filters" id="catF"></div>
    <div class="filters" id="stF" style="margin-top:8px"></div>
    <div class="bar2">
      <input id="q" type="search" placeholder="Search title, platform, notes" aria-label="Search">
      <select id="sort" aria-label="Sort">
        <option value="recent">Recent</option>
        <option value="rating">Top rated</option>
        <option value="title">A to Z</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <main id="stats" hidden></main>
  <footer class="credit">Built by Mi Robo</footer>
</div>

<button class="fab" id="addBtn">+ Add</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= config ================= */
const CATS=[
  {id:"anime",label:"Anime",unit:"Ep",c:"#ff4f8b",src:"anime"},
  {id:"manga",label:"Manga",unit:"Ch",c:"#ff8a3d",src:"manga"},
  {id:"series",label:"Series/Playlist",unit:"Ep",c:"#3e8bff",src:"tv"},
  {id:"movie",label:"Movies",unit:"",c:"#9b5bff",src:"movie"},
  {id:"video",label:"Videos",unit:"",c:"#9bdc3a",src:""},
  {id:"book",label:"Books",unit:"Pg",c:"#2fbf85",src:"book"},
  {id:"essay",label:"Essays",unit:"",c:"#e6b422",src:""},
  {id:"doc",label:"Docs",unit:"",c:"#22b8c8",src:""}
];
const STATUS=[
  {id:"want",label:"Wanna"},
  {id:"progress",label:"In progress"},
  {id:"completed",label:"Completed"},
  {id:"reviewed",label:"Reviewed"},
  {id:"dropped",label:"Dropped"}
];
const PLATFORMS={
  anime:["Crunchyroll","Netflix","YouTube","Prime Video","Bilibili","HiAnime"],
  manga:["MangaDex","Webtoon","Manga Plus","Tachiyomi","Physical copy"],
  series:["Netflix","Prime Video","Disney+","Hoichoi","Chorki","YouTube"],
  movie:["Netflix","Prime Video","Disney+","Hoichoi","Chorki","YouTube","Cinema"],
  video:["YouTube","Vimeo","Nebula","TikTok","Instagram"],
  book:["Kindle","PDF","Physical copy","Google Play Books","Rokomari"],
  essay:["Substack","Medium","Blog","PDF","Newsletter"],
  doc:["YouTube","Netflix","Nebula","CuriosityStream","Prime Video"]
};
const KEY="omishelf.v2", KTOK="omishelf.token", KGIST="omishelf.gist", KTHEME="omishelf.theme";
const FILE="omishelf.json";

/* ================= state ================= */
let sharedName="";
const SHARE=new URLSearchParams(location.search).get("u");
const readOnly=!!SHARE;
const safe=u=>/^https?:\/\//i.test(u||"")?u:"";
let all=[];                 // includes tombstones
let view="lib", fCat="all", fSt="all", draft=null;
const unitWord=u=>({Ep:"eps",Ch:"chs",Pg:"pages",Vid:"videos"}[u]||"");
const cat=id=>CATS.find(c=>c.id===id)||CATS[0];
const stL=id=>(STATUS.find(s=>s.id===id)||{}).label||id;
const live=()=>all.filter(i=>!i.deleted&&!String(i.id).startsWith("__"));
const getName=()=>{const p=all.find(i=>i.id==="__profile");return p&&p.name?p.name:""};
function setName(n){const p=all.find(x=>x.id==="__profile")||{id:"__profile"};put({...p,name:n,deleted:false})}
function renderTitle(){
  const n=readOnly?sharedName:getName();
  $("who").hidden=!n;
  if(n){const ini=(Array.from(n)[0]||"").toUpperCase();$("av").textContent=ini;$("whoName").textContent=n+"’s";
    $("hero").hidden=!readOnly;
    if(readOnly){
      const L=live(),r=L.filter(i=>i.rating),avg=r.length?(r.reduce((a,b)=>a+b.rating,0)/r.length).toFixed(1):"–";
      $("hAv").textContent=ini;$("hName").textContent=n+"’s shelf";
      $("hStats").innerHTML=`<span><b>${L.filter(i=>i.status==="completed"||i.status==="reviewed").length}</b> finished</span><span><b>${L.filter(i=>i.status==="progress").length}</b> in progress</span><span><b>${avg}</b> avg rating</span>`;
    }
  }else $("hero").hidden=true;
  document.title=(n?n+"’s ":"")+"Mi Robo Shelf";
  if(readOnly&&n)$("bannerTxt").textContent="Viewing "+n+"’s shelf (read only)";
}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function toast(t){const el=$("toast");el.textContent=t;el.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display="none",2400)}
function saveLocal(){if(readOnly)return;ls.set(KEY,JSON.stringify(all))}
function loadLocal(){try{all=JSON.parse(ls.get(KEY)||"[]")}catch(e){all=[]}}

async function put(item){
  item.updated=Date.now();
  const i=all.findIndex(x=>x.id===item.id);
  if(i>=0)all[i]=item;else all.push(item);
  saveLocal();render();schedulePush();
}
function del(id){
  const it=all.find(x=>x.id===id);if(!it)return;
  put({id,deleted:true,updated:Date.now()});
}

/* ================= GitHub Gist sync ================= */
let pushT=null, syncing=false;
const tok=()=>ls.get(KTOK);
function dot(s){$("syncDot").className="d "+(s||"")}
async function gh(path,opt={}){
  const r=await fetch("https://api.github.com"+path,{...opt,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+tok(),...(opt.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok)throw new Error("GitHub "+r.status);
  return r.json();
}
function merge(remote){
  const m=new Map(all.map(i=>[i.id,i]));
  for(const r of remote){const l=m.get(r.id);if(!l||(r.updated||0)>(l.updated||0))m.set(r.id,r)}
  all=[...m.values()];
}
async function findOrCreateGist(){
  let id=ls.get(KGIST);
  if(id)return id;
  const list=await gh("/gists?per_page=100");
  const g=list.find(x=>x.files&&x.files[FILE]);
  if(g){id=g.id}else{
    const c=await gh("/gists",{method:"POST",body:JSON.stringify({description:"Mi Robo Shelf data",public:false,files:{[FILE]:{content:JSON.stringify(all)}}})});
    id=c.id;
  }
  ls.set(KGIST,id);return id;
}
async function pull(){
  const id=await findOrCreateGist();
  const g=await gh("/gists/"+id);
  const f=g.files[FILE];if(!f)return;
  let txt=f.content;
  if(f.truncated){txt=await (await fetch(f.raw_url)).text()}
  try{merge(JSON.parse(txt||"[]"))}catch(e){}
}
async function sync(){
  if(!tok()||syncing)return;
  syncing=true;dot("busy");
  try{
    await pull();saveLocal();render();
    const id=ls.get(KGIST);
    await gh("/gists/"+id,{method:"PATCH",body:JSON.stringify({files:{[FILE]:{content:JSON.stringify(all)}}})});
    dot("ok");
  }catch(e){dot("err");console.warn(e)}
  syncing=false;
}
function schedulePush(){if(!tok())return;clearTimeout(pushT);pushT=setTimeout(sync,1500)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});

/* ================= cover search ================= */
async function searchMedia(src,q){
  if(src==="anime"||src==="manga"){
    const query=`query($s:String){Page(perPage:8){media(search:$s,type:${src==="anime"?"ANIME":"MANGA"},sort:SEARCH_MATCH){title{english romaji}coverImage{large}episodes chapters}}}`;
    const r=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({query,variables:{s:q}})});
    const j=await r.json();
    return (j.data?.Page?.media||[]).map(m=>({title:m.title.english||m.title.romaji,cover:m.coverImage?.large||"",total:(src==="anime"?m.episodes:m.chapters)||0}));
  }
  if(src==="tv"){
    const j=await (await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(q))).json();
    return j.slice(0,8).map(x=>({title:x.show.name,cover:x.show.image?.medium||"",tvId:x.show.id,total:0}));
  }
  if(src==="movie"){
    const j=await (await fetch("https://itunes.apple.com/search?media=movie&limit=8&term="+encodeURIComponent(q))).json();
    return (j.results||[]).map(x=>({title:x.trackName,creator:x.artistName||"",cover:(x.artworkUrl100||"").replace("100x100","400x600"),total:0}));
  }
  if(src==="book"){
    const j=await (await fetch("https://openlibrary.org/search.json?limit=8&fields=title,author_name,cover_i,number_of_pages_median&q="+encodeURIComponent(q))).json();
    return (j.docs||[]).map(d=>({title:d.title,creator:(d.author_name||[])[0]||"",cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:"",total:d.number_of_pages_median||0}));
  }
  return [];
}

/* ================= render: library ================= */
function cover(i,small){
  const c=cat(i.cat);
  return `<span class="cv" style="--c:${c.c}">${i.cover?`<img src="${esc(i.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}${i.cover?"":`<span class="ph"><b>${esc(i.title)}</b></span>`}${small?"":`<span class="badge">${c.label}</span>`}</span>`;
}
function progText(i){const u=cat(i.cat).unit;if(!u)return"";return `${u} ${i.cur||0}${i.total?" / "+i.total:""}`}
function pct(i){return i.total?Math.min(100,Math.round((i.cur||0)/i.total*100)):0}

  $("contSec").hidden=!prog.length;
  $("contCount").textContent=prog.length?prog.length+" going":"";
  $("rail").innerHTML=prog.map(i=>{
    const c=cat(i.cat);
    return `<div class="cont">
      ${cover(i,true)}
      <div class="info">
        <button class="t" data-a="edit" data-id="${i.id}" style="text-align:left">${esc(i.title)}</button>
        <div class="w">${i.creator?"by "+esc(i.creator)+" · ":""}${c.label}${i.where?" on "+esc(i.where):""}</div>
        ${c.unit?`<div class="where-now">${i.cur||0}<small>${i.total?" / "+i.total:""} ${unitWord(c.unit)}</small></div>
        <div class="pbar"><i style="width:${pct(i)}%"></i></div>

function renderFilters(){

  $("catF").innerHTML=`<button class="chip" aria-pressed="${fCat==="all"}" data-c="all">All <b>${L.length}</b></button>`+

function renderGrid(){
  const q=$("q").value.trim().toLowerCase();
  let r=live().filter(i=>(fCat==="all"||i.cat===fCat)&&(fSt==="all"||i.status===fSt)&&(!q||[i.title,i.creator,i.where,i.note].join(" ").toLowerCase().includes(q)));
  const s=$("sort").value;
  if(s==="rating")r.sort((a,b)=>(b.rating||0)-(a.rating||0)||b.updated-a.updated);
  else if(s==="title")r.sort((a,b)=>a.title.localeCompare(b.title));
  else r.sort((a,b)=>b.updated-a.updated);
  $("grid").innerHTML=r.length?r.map(i=>`<div class="tile">
      <button data-a="edit" data-id="${i.id}" style="display:block;width:100%">${cover(i)}</button>
      <button class="fav ${i.fav?"on":""}" data-a="fav" data-id="${i.id}" aria-label="Favorite" aria-pressed="${!!i.fav}">${i.fav?"♥":"♡"}</button>
      <div class="tt">${esc(i.title)}</div>
      ${i.creator?`<div class="by">${esc(i.creator)}</div>`:""}
      <div class="mm"><span class="st ${i.status}">${stL(i.status)}</span>${i.rating?`<span>★ ${i.rating}</span>`:""}${progText(i)&&i.status==="progress"?`<span>${progText(i)}</span>`:""}${i.where?`<span>${esc(i.where)}</span>`:""}</div>
    </div>`).join(""):
    `<div class="empty"><b>${live().length?"Nothing here":"Your shelf is empty"}</b>${live().length?"Try another filter or search.":"Tap + Add, search a title, and its cover shows up."}</div>`;
  // progress strips on covers
  r.forEach((i,k)=>{if(i.status==="progress"&&i.total){const cv=$("grid").children[k]?.querySelector(".cv");if(cv)cv.insertAdjacentHTML("beforeend",`<span class="pb"><i style="width:${pct(i)}%"></i></span>`)}});
}

/* ================= render: stats ================= */
function renderStats(){
  const L=live(),n=s=>L.filter(i=>i.status===s).length;
  const rated=L.filter(i=>i.rating);
  const avg=rated.length?(rated.reduce((a,b)=>a+b.rating,0)/rated.length).toFixed(1):"–";
  const yr=new Date().getFullYear();
  const yrDone=L.filter(i=>i.doneAt&&new Date(i.doneAt).getFullYear()===yr&&(i.status==="completed"||i.status==="reviewed")).length;
  const eps=L.filter(i=>cat(i.cat).unit==="Ep").reduce((a,b)=>a+(+b.cur||0),0);
  const chs=L.filter(i=>i.cat==="manga").reduce((a,b)=>a+(+b.cur||0),0);
  const mx=Math.max(1,...CATS.map(c=>L.filter(i=>i.cat===c.id).length));
  const plat={};L.forEach(i=>{if(i.where)plat[i.where]=(plat[i.where]||0)+1});
  const plats=Object.entries(plat).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const top=[...rated].sort((a,b)=>b.rating-a.rating||b.updated-a.updated).slice(0,5);
  $("stats").innerHTML=`
  <div class="sgrid">
    <div class="sbox"><b>${L.length}</b><span>On shelf</span></div>
    <div class="sbox"><b>${n("progress")}</b><span>In progress</span></div>
    <div class="sbox"><b>${n("want")}</b><span>Wanna list</span></div>
    <div class="sbox"><b>${yrDone}</b><span>Finished in ${yr}</span></div>
    <div class="sbox"><b>${eps}</b><span>Episodes logged</span></div>
    <div class="sbox"><b>${chs}</b><span>Chapters logged</span></div>
    <div class="sbox"><b>${avg}</b><span>Average rating</span></div>
    <div class="sbox"><b>${L.filter(i=>i.fav).length}</b><span>Favorites</span></div>
  </div>
  <div class="panel"><h3>By category</h3>${CATS.map(c=>{const k=L.filter(i=>i.cat===c.id).length;return `<div class="hb"><span>${c.label}</span><div class="pbar"><i style="width:${k/mx*100}%;background:${c.c}"></i></div><b>${k}</b></div>`}).join("")}</div>
  <div class="panel"><h3>Top rated</h3>${top.length?top.map(i=>`<div class="rowl"><span>${esc(i.title)}</span><span style="color:var(--gold)">★ ${i.rating}</span></div>`).join(""):`<span class="hint">Rate something and it shows up here.</span>`}</div>
  <div class="panel"><h3>Where you watch and read</h3>${plats.length?plats.map(([p,k])=>`<div class="rowl"><span>${esc(p)}</span><b>${k}</b></div>`).join(""):`<span class="hint">Add a platform to any item to see this.</span>`}</div>
  <div class="panel"><h3>Backup</h3>
    <div class="actions"><button class="btn main" id="expBtn">Download backup</button></div>
    <textarea id="impTxt" placeholder="Paste a backup here to import" style="margin-top:10px"></textarea>
    <div class="actions"><button class="btn" id="impBtn">Import and merge</button></div>
  </div>`;
  $("expBtn").onclick=()=>{
    const b=new Blob([JSON.stringify(all,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="omishelf-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  $("impBtn").onclick=()=>{
    try{const arr=JSON.parse($("impTxt").value);if(!Array.isArray(arr))throw 0;merge(arr);saveLocal();render();schedulePush();toast("Imported "+arr.length+" items");$("impTxt").value=""}
    catch(e){toast("That backup doesn’t look right")}
  };
}

function render(){renderTitle();if(view==="lib"){renderRail();renderFilters();renderGrid()}else renderStats()}

function readEdit(){
  const d=draft;if(!d)return;
  d.title=$("eTitle").value.trim();
  if($("eCur")){d.cur=Math.max(0,+$("eCur").value||0);d.total=Math.max(0,+$("eTot").value||0)}
  d.creator=$("eBy").value.trim();d.where=$("eWhere").value.trim();d.link=$("eLink").value.trim();d.note=$("eNote").value.trim();
}
$("sheet").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="setSave"||b.id==="setOff"||b.id==="setSyncNow")return; // handled in sync sheet
  if(!draft)return;
  if(b.dataset.img){
    readEdit();const m=b.dataset.img;
    if(m==="up"){$("eFile").click();return}
    if(m==="rm")draft.cover="";
    if(m==="link"){
      if(!safe(draft.link)){toast("Paste a link first");return}
      b.textContent="…";
      const yt=ytId(draft.link);let ytDone=false;
      if(yt){
        const big="https://i.ytimg.com/vi/"+yt+"/maxresdefault.jpg";
        draft.cover=(await imgOk(big))?big:"https://i.ytimg.com/vi/"+yt+"/mqdefault.jpg";
        ytDone=true;if(!draft.where)draft.where="YouTube";
      }
      try{
        const j=await (await fetch("https://api.microlink.io/?url="+encodeURIComponent(draft.link))).json();
        const x=j.data||{};
        if(!ytDone&&x.image&&x.image.url)draft.cover=x.image.url;
        if(x.author&&!draft.creator)draft.creator=x.author;
        if(!draft.title&&x.title)draft.title=x.title;
        if(!draft.where&&x.publisher)draft.where=x.publisher;
        toast(x.image||ytDone?"Image added":"No image found. Try Upload.");
      }catch(err){toast(ytDone?"Thumbnail added":"Couldn’t fetch. Try Upload.")}
    }
    const st=$("sheet").scrollTop;drawEdit();$("sheet").scrollTop=st;return;
  }
  if(b.dataset.k){
    readEdit();const k=b.dataset.k,v=b.dataset.v;
    if(k==="cat"){draft.cat=v;found=[]}
    if(k==="status")draft.status=v;
    if(k==="where")draft.where=draft.where===v?"":v;
    if(k==="rating"){const n=+v;draft.rating=draft.rating===n?0:n}
    if(k==="fav")draft.fav=!draft.fav;
    const st=$("sheet").scrollTop;drawEdit();$("sheet").scrollTop=st;return;
  }
  if(b.dataset.step){const inp=$("eCur");inp.value=Math.max(0,(+inp.value||0)+(+b.dataset.step));return}
  if(b.id==="findBtn"){
    readEdit();if(!draft.title){toast("Type a title first");return}
    b.textContent="…";
    try{found=await searchMedia(cat(draft.cat).src,draft.title);if(!found.length)toast("No matches. Just save it manually.")}
    catch(err){toast("Search failed. Check your internet.")}
    const st=$("sheet").scrollTop;drawEdit();$("sheet").scrollTop=st;return;
  }
  if(b.dataset.pick!=null){
    readEdit();const r=found[+b.dataset.pick];
    draft.title=r.title;draft.cover=r.cover;if(r.creator)draft.creator=r.creator;if(r.total)draft.total=r.total;
    if(r.tvId){try{const eps=await (await fetch(`https://api.tvmaze.com/shows/${r.tvId}/episodes`)).json();draft.total=eps.length||draft.total}catch(err){}}
    found=[];const st=$("sheet").scrollTop;drawEdit();$("sheet").scrollTop=st;toast("Cover added");return;
  }
  if(b.id==="delBtn"){const id=draft.id;closeSheet();del(id);toast("Deleted");return}
  if(b.id==="saveBtn"){
    readEdit();const d=draft;
    if(!d.title){toast("Add a title first");$("eTitle").focus();return}
    if(d.total&&d.cur>=d.total&&d.status==="progress")d.status="completed";
    if(d.cur>0&&d.status==="want")d.status="progress";
    if(d.rating&&d.status==="completed")d.status="reviewed";
    if((d.status==="completed"||d.status==="reviewed")&&!d.doneAt)d.doneAt=Date.now();
    delete d._new;closeSheet();put(d);toast("Saved");
  }
});

async function loadShared(){
  try{
    const r=await fetch("https://api.github.com/gists/"+encodeURIComponent(SHARE),{headers:{"Accept":"application/vnd.github+json"}});
    if(!r.ok)throw 0;
    const g=await r.json();const f=g.files&&g.files[FILE];if(!f)throw 0;
    let txt=f.content;if(f.truncated)txt=await (await fetch(f.raw_url)).text();
    const arr=JSON.parse(txt||"[]");
    const pr=Array.isArray(arr)?arr.find(i=>i&&i.id==="__profile"):null;sharedName=pr&&pr.name?pr.name:"";
    all=Array.isArray(arr)?arr.filter(i=>i&&i.id&&i.title&&!i.deleted):[];
    render();
  }catch(e){$("bannerTxt").textContent="Couldn’t load this shelf. Check the link.";}
}

function ytId(u){
  try{const x=new URL(u);
    if(x.hostname==="youtu.be")return x.pathname.slice(1);
    if(/youtube\.com$/.test(x.hostname)&&x.pathname==="/watch")return x.searchParams.get("v")||"";
  }catch(e){}
  return "";
}
function imgOk(u){return new Promise(r=>{const i=new Image();i.onload=()=>r(i.naturalWidth>200);i.onerror=()=>r(false);i.src=u})}
function shrink(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const k=Math.min(1,420/Math.max(im.width,1),630/Math.max(im.height,1));
      const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      res(c.toDataURL("image/jpeg",.78));
    };
    im.onerror=rej;im.src=u;
  });
}
$("sheet").addEventListener("change",async e=>{
  if(e.target.id!=="eFile"||!draft)return;
  const f=e.target.files[0];if(!f)return;
  readEdit();
  try{draft.cover=await shrink(f);toast("Image added")}catch(err){toast("Couldn’t read that image")}
  const st=$("sheet").scrollTop;drawEdit();$("sheet").scrollTop=st;
});

/* ================= sheet: sync settings ================= */
function syncSheet(){
  draft=null;
  const on=!!tok();
  openSheet(`<h2>Your shelf</h2>
  <div class="f"><label for="nameIn">Your name (shows under the logo)</label>
    <div class="finder"><input id="nameIn" value="${esc(getName())}" placeholder="Your name" autocomplete="given-name"><button class="go" id="nameSave">Save</button></div></div>
  <h2 style="margin-top:8px">Sync across devices</h2>
  ${on?`<p class="hint">Connected to GitHub. Your shelf saves to a private Gist and syncs every time you change something or reopen the page.</p>
  <div class="f" style="margin-top:14px"><label for="shareLink">Share link for friends (read only)</label>
    <input id="shareLink" readonly value="${esc(location.origin+location.pathname+"?u="+(ls.get(KGIST)||""))}">
    <div class="hint">They see your covers, ratings, reviews and where to watch. They can’t edit.</div></div>
  <div class="actions"><button class="btn main" id="setShare">Copy share link</button></div>
  <div class="actions"><button class="btn" id="setSyncNow">Sync now</button><button class="btn danger" id="setOff">Disconnect</button></div>`:
  `<p class="hint">Your shelf saves to a private GitHub Gist. Do this once on each device:</p>
  <ol class="hint" style="padding-left:18px;line-height:1.7">
    <li>Open github.com/settings/tokens and choose “Generate new token (classic)”</li>
    <li>Tick only the <b>gist</b> box, set expiration to “No expiration”</li>
    <li>Copy the token and paste it below</li>
  </ol>
  <div class="f"><label for="tokIn">GitHub token</label><input id="tokIn" type="password" autocomplete="off" placeholder="ghp_…"></div>
  <div class="actions"><button class="btn main" id="setSave">Connect</button></div>`}`);
}
$("sheet").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="nameSave"){setName($("nameIn").value.trim());toast("Name saved");return}
  if(b.id==="setSave"){
    const t=$("tokIn").value.trim();if(!t){toast("Paste your token first");return}
    ls.set(KTOK,t);ls.del(KGIST);b.textContent="Connecting…";
    try{await gh("/user");await sync();closeSheet();toast("Synced with GitHub")}
    catch(err){ls.del(KTOK);dot("err");b.textContent="Connect";toast("Token didn’t work. Check the gist box.")}
  }
  if(b.id==="setOff"){ls.del(KTOK);ls.del(KGIST);dot("");closeSheet();toast("Disconnected. Data stays on this device.")}
  if(b.id==="setSyncNow"){await sync();toast("Synced")}
  if(b.id==="setShare"){
    const inp=$("shareLink");
    if(!ls.get(KGIST)){toast("Sync once first");return}
    try{await navigator.clipboard.writeText(inp.value);toast("Share link copied")}catch(err){inp.select();toast("Select and copy the link")}
  }
});

/* ================= events ================= */
async function quick(e){
  const b=e.target.closest("[data-a]");if(!b)return;
  const it=all.find(x=>x.id===b.dataset.id);if(!it)return;
  const a=b.dataset.a;
  if(a==="edit"){readOnly?detail(it.id):edit(it.id);return}
  if(readOnly)return;
  const n={...it};
  if(a==="fav")n.fav=!n.fav;
  if(a==="minus")n.cur=Math.max(0,(+n.cur||0)-1);
  if(a==="plus"){
    n.cur=(+n.cur||0)+1;if(n.status!=="progress")n.status="progress";
    if(n.total&&n.cur>=n.total){n.cur=n.total;n.status="completed";n.doneAt=Date.now();toast("Finished “"+n.title+"”! Rate it?")}
  }
  if(a==="done"){n.status="completed";n.doneAt=Date.now();toast("Nice! Tap it to rate.")}
  put(n);
}
$("rail").addEventListener("click",quick);
$("grid").addEventListener("click",quick);

$("tLib").onclick=()=>setView("lib");$("tStats").onclick=()=>setView("stats");
function applyTheme(t){document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==="light"?"#f4f2fb":"#0c0a14"}
$("themeBtn").onclick=()=>{const t=document.documentElement.dataset.theme==="light"?"dark":"light";applyTheme(t);ls.set(KTHEME,t)};

/* ================= start ================= */
applyTheme(ls.get(KTHEME)||"dark");
if(readOnly){
  document.body.classList.add("ro");
  $("addBtn").hidden=true;$("syncBtn").hidden=true;$("banner").hidden=false;
  render();loadShared();
}else{
  loadLocal();render();
  if(tok())sync();else dot("");
}
